name: Oximon
options:
  bundleIdPrefix: com.robshakir
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"

targets:
  Oximon:
    type: application
    platform: iOS
    sources:
      - path: Oximon
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robshakir.oximon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Oximon/Oximon.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: true
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_FILE: Oximon/Resources/Info.plist
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Oximon connects to your Bluetooth pulse oximeter to display real-time SpO₂ and heart rate telemetry."
        INFOPLIST_KEY_UILaunchScreen_Generation: true
    entitlements:
      path: Oximon/Oximon.entitlements

  OximonTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OximonTests
    dependencies:
      - target: Oximon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robshakir.oximon.tests
        GENERATE_INFOPLIST_FILE: true
